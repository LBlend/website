services:
  furumo-website:
    build: .
    container_name: furumo-website
    ports:
      - "4321:4321"
    env_file:
      - .env
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4321/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
